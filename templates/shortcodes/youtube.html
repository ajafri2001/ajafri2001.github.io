<div align="center">
  <iframe
    width="{% if width %}{{ width }}{% else %}560{% endif %}"
    height="{% if height %}{{ height }}{% else %}315{% endif %}"
    src="https://www.youtube.com/embed/{{ id }}"
    frameborder="0"
    allow="
      accelerometer;
      autoplay;
      clipboard-write;
      encrypted-media;
      gyroscope;
      picture-in-picture;
      web-share;
    "
    allowfullscreen
  ></iframe>
</div>
